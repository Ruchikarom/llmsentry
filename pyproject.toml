[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmsentry-ai"
version = "0.1.1"
description = "Drop-in prompt-injection firewall for LLM apps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sunita Tiwary" },
]
keywords = ["llm", "security", "prompt-injection", "firewall", "proxy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "groq>=0.9",
]



[project.urls]
Homepage = "https://github.com/Ruchikarom/llmsentry"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmsentry*"]
